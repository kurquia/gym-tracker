name: gym_tracker
description: "Personal gym tracker: log workouts, track progress, see which muscles you train."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  clock_notification:
    path: packages/clock_notification
  flutter_local_notifications: ^22.3.2
  table_calendar: ^3.3.0
  timezone: ^0.11.2
  fl_chart: ^1.2.0
  flutter_math_fork: ^0.7.4
  share_plus: ^13.3.1
  file_picker: ^13.2.0
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/GUST-FONT-LICENSE.txt
    - assets/icon/icon.png
    - assets/data/exercises.json
    - assets/data/curated_muscles.json
    - assets/models/body.bin
    - assets/models/BODY-MODEL-LICENSE.txt

  fonts:
    - family: TeXGyreSchola
      fonts:
        - asset: assets/fonts/texgyreschola-regular.otf
        - asset: assets/fonts/texgyreschola-italic.otf
          style: italic
        - asset: assets/fonts/texgyreschola-bold.otf
          weight: 700
